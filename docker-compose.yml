services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: rova
      POSTGRES_PASSWORD: rova
      POSTGRES_DB: rova
    ports:
      - "5432:5432"
    volumes:
      - rova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rova -d rova"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rova_pgdata:
